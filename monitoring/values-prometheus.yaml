server:
  persistentVolume:
    enabled: true
    size: 5Gi
  retention: 7d

extraScrapeConfigs: |
  - job_name: factory-api
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: factory

serverFiles:
  alerting_rules.yml:
    groups:
      - name: factory-api
        rules:
          - alert: FactoryApiDown
            expr: up{job="factory-api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Factory API ne répond plus
          - alert: FactoryApiHighErrorRate
            expr: >-
              sum(rate(factory_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(factory_http_requests_total[5m])), 0.001)
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Plus de 5 % d'erreurs HTTP pendant 5 minutes
