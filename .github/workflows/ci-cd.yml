name: Usine logicielle

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Vérifier le style
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Lancer les tests avec couverture
        run: python -m pytest --junitxml=report.xml --cov-report=xml:coverage.xml
      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            report.xml
            coverage.xml

  manifests:
    name: Manifests Kubernetes
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Générer staging et production
        run: |
          kubectl kustomize k8s/overlays/staging > /tmp/staging.yaml
          kubectl kustomize k8s/overlays/production > /tmp/production.yaml
          test -s /tmp/staging.yaml
          test -s /tmp/production.yaml
          grep -q '^  namespace: factory-staging$' /tmp/staging.yaml
          grep -q '^  namespace: factory$' /tmp/production.yaml
      - name: Vérifier Docker Compose
        run: docker compose config --quiet

  container:
    name: Image et sécurité
    needs: [quality, manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Construire l'image immuable
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "factory-api:${GITHUB_SHA}" .
      - name: Bloquer les vulnérabilités critiques
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --skip-version-check \
            --sbom-sources="" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "factory-api:${GITHUB_SHA}"
      - name: Se connecter à GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image
        if: github.event_name != 'pull_request'
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag "factory-api:${GITHUB_SHA}" "$image:${GITHUB_SHA}"
          docker push "$image:${GITHUB_SHA}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag "factory-api:${GITHUB_SHA}" "$image:latest"
            docker push "$image:latest"
          fi
