apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factory-api-ingress
  namespace: factory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: factory-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
