apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-api
  namespace: factory
spec:
  replicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-api-config
  namespace: factory
data:
  APP_ENV: staging
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factory-api
  namespace: factory
spec:
  rules:
    - host: factory-staging.192.168.56.12.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: factory-api
                port:
                  name: http
